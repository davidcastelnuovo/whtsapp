<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111b21;
      color: #e9edef;
      direction: rtl;
    }
    .header {
      background: #202c33;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a3942;
    }
    .header .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #00a884, #25d366);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .header .version {
      font-size: 11px;
      color: #8696a0;
    }
    .content {
      padding: 16px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #202c33;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00a884;
    }
    .status .dot.inactive { background: #8696a0; }
    .status span { font-size: 13px; }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: #8696a0;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      background: #2a3942;
      border: 1px solid #3b4a54;
      border-radius: 8px;
      color: #e9edef;
      font-size: 13px;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    .field input:focus {
      border-color: #00a884;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #00a884;
      color: #111b21;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #06cf9c; }
    .btn:disabled { background: #3b4a54; color: #8696a0; cursor: not-allowed; }
    .msg {
      font-size: 12px;
      margin-top: 8px;
      text-align: center;
    }
    .msg.success { color: #00a884; }
    .msg.error { color: #ea4335; }
    .links {
      padding: 12px 16px;
      border-top: 1px solid #2a3942;
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .links a {
      font-size: 12px;
      color: #00a884;
      text-decoration: none;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">AI</div>
    <div>
      <h1>WhatsApp AIOS</h1>
      <div class="version">v1.0.0</div>
    </div>
  </div>

  <div class="content">
    <div class="status" id="status">
      <div class="dot inactive" id="statusDot"></div>
      <span id="statusText">בודק חיבור...</span>
    </div>

    <div class="field">
      <label>מפתח API של Claude</label>
      <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
    </div>

    <button class="btn" id="saveBtn">שמור מפתח</button>
    <div class="msg" id="message"></div>
  </div>

  <div class="links">
    <a href="#" id="openSettings">הגדרות מתקדמות</a>
    <a href="https://web.whatsapp.com" target="_blank">פתח WhatsApp</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>

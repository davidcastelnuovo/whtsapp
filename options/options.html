<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp AIOS - הגדרות</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111b21;
      color: #e9edef;
      direction: rtl;
      min-height: 100vh;
      padding: 40px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #8696a0; margin-bottom: 32px; }
    .section {
      background: #202c33;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section h2 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #00a884;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 13px;
      color: #8696a0;
      margin-bottom: 6px;
    }
    .field input[type="text"],
    .field input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      background: #2a3942;
      border: 1px solid #3b4a54;
      border-radius: 8px;
      color: #e9edef;
      font-size: 13px;
      outline: none;
      direction: ltr;
    }
    .field input:focus { border-color: #00a884; }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #2a3942;
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-row .label { font-size: 14px; }
    .toggle-row .desc { font-size: 12px; color: #8696a0; }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #3b4a54;
      border-radius: 12px;
      transition: 0.3s;
    }
    .toggle .slider:before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: #e9edef;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle input:checked + .slider { background: #00a884; }
    .toggle input:checked + .slider:before { transform: translateX(20px); }
    .btn {
      padding: 10px 24px;
      background: #00a884;
      color: #111b21;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #06cf9c; }
    .msg { font-size: 13px; margin-top: 12px; }
    .msg.success { color: #00a884; }
    .msg.error { color: #ea4335; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WhatsApp AIOS - הגדרות</h1>
    <p class="subtitle">הגדר את מערכת ה-AI שלך</p>

    <div class="section">
      <h2>חיבור API</h2>
      <div class="field">
        <label>מפתח API של Claude (Anthropic)</label>
        <input type="password" id="apiKey" placeholder="sk-ant-...">
      </div>
      <button class="btn" id="saveApi">שמור</button>
      <div class="msg" id="apiMsg"></div>
    </div>

    <div class="section">
      <h2>כללי</h2>
      <div class="toggle-row">
        <div>
          <div class="label">תגובות אוטומטיות</div>
          <div class="desc">הפעל מענה אוטומטי לפי כללים</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="autoReply">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="label">סינון ספאם</div>
          <div class="desc">זיהוי אוטומטי של הודעות ספאם</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="spamFilter">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="label">קטגוריות צ'אט</div>
          <div class="desc">סיווג אוטומטי של שיחות</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="chatCategories" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <button class="btn" id="saveSettings">שמור הגדרות</button>
    <div class="msg" id="settingsMsg"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
